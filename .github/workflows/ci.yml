name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hireai_test
          POSTGRES_USER: hireai
          POSTGRES_PASSWORD: hireai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hireai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        env:
          SECRET_KEY: ci-secret-key
          POSTGRES_DB: hireai_test
          POSTGRES_USER: hireai
          POSTGRES_PASSWORD: hireai
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY: ci-secret-key
          POSTGRES_DB: hireai_test
          POSTGRES_USER: hireai
          POSTGRES_PASSWORD: hireai
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key
          POSTGRES_DB: hireai_test
          POSTGRES_USER: hireai
          POSTGRES_PASSWORD: hireai
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t hireai-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t hireai-frontend:ci ./frontend
